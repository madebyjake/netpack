name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Each step is a make target, so the Makefile is the single definition of what
# a check is and CI cannot drift from what `make check` runs locally. They stay
# separate steps rather than one `make check` so a failure names itself in the
# GitHub UI without reading the log.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck and bats
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: shellcheck
        run: make shellcheck

      - name: ruff
        run: make ruff

      - name: py_compile
        run: make compile

      - name: pytest
        run: make test

      - name: bats
        run: make bats

      - name: smoke
        run: make smoke
