name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Each step is a make target, so the Makefile is the single definition of what
# a check is and CI cannot drift from what `make check` runs locally. They stay
# separate steps rather than one `make check` so a failure names itself in the
# GitHub UI without reading the log.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck and bats
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: shellcheck
        run: make shellcheck

      - name: ruff
        run: make ruff

      - name: typecheck
        run: make typecheck

      - name: py_compile
        run: make compile

      - name: pytest
        run: make test

      - name: bats
        run: make bats

      - name: smoke
        run: make smoke

  # Debian is the target; macOS is the development platform, and its older
  # userland is what catches portability slips — GNU Make 3.81, bash 3.2, and
  # BSD stat all behave differently from the Linux job above. Not a required
  # check: a macOS-only failure must not block a release.
  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # bash: the tools use declare -g and ${var^^}, which are bash 4+, and
      # macOS ships 3.2. coreutils: portcheck needs GNU timeout, which macOS
      # has no equivalent of in its base system.
      - name: Install shellcheck, bats, bash, and coreutils
        run: brew install shellcheck bats-core bash coreutils

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Record the userland under test
        run: |
          make --version | head -1
          echo "system:  $(/bin/bash --version | head -1)"
          echo "on PATH: $(bash --version | head -1)"

      - name: shellcheck
        run: make shellcheck

      - name: ruff
        run: make ruff

      - name: typecheck
        run: make typecheck

      - name: py_compile
        run: make compile

      - name: pytest
        run: make test

      # Tests needing /sys/class/net skip themselves here.
      - name: bats
        run: make bats

      - name: smoke
        run: make smoke
